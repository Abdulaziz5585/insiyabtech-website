name: Deploy InsiyabTech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate payload chunks
        shell: bash
        run: |
          set -u
          bad=0
          for f in payload_v2/index/part*.b64 payload_v2/solutions/part*.b64; do
            printf 'checking %s ... ' "$f"
            if base64 --decode "$f" >/dev/null 2>&1; then
              echo OK
            else
              echo INVALID
              bad=1
            fi
          done
          exit $bad

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          wget --quiet --recursive --level=3 --page-requisites --convert-links --adjust-extension --no-parent --no-host-directories --directory-prefix=_site https://insiyabtech.com.sa/ || true
          : > _site/index.html
          for f in payload_v2/index/part*.b64; do base64 --decode "$f" >> _site/index.html; done
          : > _site/solutions.html
          for f in payload_v2/solutions/part*.b64; do base64 --decode "$f" >> _site/solutions.html; done
          mkdir -p _site/assets
          cp assets/insiyab-mark.webp _site/assets/insiyab-mark.webp
          touch _site/.nojekyll
          echo "7742d95149c03c89df9b688f3e5ebabd4dd8ee6d3f2da1ba7c95af4b738ee609  _site/index.html" | sha256sum -c -
          echo "fb3b32e6a1ed82bc8ebc35839c0c457e2a4a9e340edc1199560608115929ef00  _site/solutions.html" | sha256sum -c -

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
