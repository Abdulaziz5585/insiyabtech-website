name: Deploy InsiyabTech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and optimize site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          required=(index.html about.html services.html solutions.html contact.html blog.html guide.html privacy.html terms.html blog-clinic-agent.html blog-n8n-vs-make.html blog-agent-vs-employee.html)
          for f in "${required[@]}"; do test -s "$f"; done

          cp -v *.html _site/
          cp CNAME _site/CNAME
          mkdir -p _site/assets
          cp assets/insiyab-mark.webp _site/assets/insiyab-mark.webp
          cp assets/insiyab-mark.png _site/assets/insiyab-mark.png
          cp assets/insiyab-mark-v4.svg _site/assets/insiyab-mark-v4.svg
          touch _site/.nojekyll

          python3 scripts/postprocess.py _site
          python3 scripts/validate_site.py _site

          # Keep the repository itself as the clean source of truth.
          cp _site/*.html .
          cp _site/robots.txt _site/sitemap.xml .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html robots.txt sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Sync optimized production pages [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
